name: "Update diagrams"

on:
  workflow_run:
    workflows:
      - "Snapshot-Build"
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

permissions:
  # This allows the workflow to create github pages
  pages: write
  # This allows the workflow to create a new commit in the gh-branch
  contents: write

jobs:
  update-build-time-diagrams:
    if: ${{ github.repository_owner == 'fedora-llvm-team' && github.event.workflow.run_conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Copr config file
        env:
          # You need to have those secrets in your repo.
          # See also: https://copr.fedorainfracloud.org/api/.
          COPR_CONFIG_FILE: ${{ secrets.COPR_CONFIG }}
        run: |
          mkdir -p ~/.config
          echo "$COPR_CONFIG_FILE" > ~/.config/copr

      - uses: actions/checkout@v7
        with:
          path: main

      - uses: ./main/.github/actions/prepare-python
        with:
          checkout-path: main

      - name: Checkout gh-pages branch
        uses: actions/checkout@v7
        with:
          ref: "gh-pages"
          path: "gh-pages"

      - name: Setup git config
        run: |
          git config --global user.name "Github Actions Bot"
          git config --global user.email "<>"

      - name: "Update stats and re-generate diagrams"
        shell: bash -e {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date +%Y%m%d)
          yesterday=$(date -d "${today} -1 day" +%Y%m%d)

          cd gh-pages

          ../main/scripts/get-build-stats.py --copr-projectname "llvm-snapshots-big-merge-${today}" | tee -a build-times.csv
          git add build-times.csv
          git commit -m "Get stats for just started builds of today (${today})"

          ../main/scripts/get-build-stats.py --copr-projectname "llvm-snapshots-big-merge-${yesterday}" | tee -a build-times.csv
          git add build-times.csv
          git commit -m "Update stats for builds from yesterday (${yesterday})"

          ../main/scripts/create-build-time-diagrams.py --datafile build-times.csv
          git add build-times-*.html
          git commit -m "Update build time diagrams"

          git push origin HEAD:gh-pages
